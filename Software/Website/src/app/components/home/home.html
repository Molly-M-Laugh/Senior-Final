<div class="page-wrapper pt-3">
  <div class="container d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 fw-bold brand-text-sm mb-0">Vital<span>Vest</span></h1>
    <div class="status-pill" [class.online]="isConnected">
      <span class="dot"></span> {{ isConnected ? 'Device Online' : 'Device Offline' }}
    </div>
  </div>

  <div class="card shadow-sm border-0 mb-4 bg-white rounded-4">
    <div class="card-body d-flex flex-wrap align-items-center justify-content-between gap-3">
      <div class="d-flex align-items-center gap-2">
        <button 
          (click)="initBluetooth()" 
          [disabled]="isConnected"
          class="btn btn-blue d-flex align-items-center gap-2">
          <span class="bi bi-bluetooth"></span> Pair ESP32
        </button>
      </div>

      <div class="d-flex align-items-center">
        <label class="small fw-bold text-muted me-2">Range:</label>
        <select #selection (change)="onSelectionChange(selection.value)" class="form-select custom-select">
          <option value="s">Last 5 Minutes</option>
          <option value="m">Last Hour</option>
          <option value="h">Last Day</option>
          <option value="W">Last Week</option>
        </select>
      </div>
    </div>

    <div class="card shadow-lg border-0 rounded-4 overflow-hidden mb-4">
      <div class="card-header bg-white border-0 pt-4 px-4">
        <h3 class="h6 fw-bold color-primary mb-0">Live Data Analytics</h3>
      </div>
      <div class="card-body">
        <canvasjs-chart [options]="chartOptions" [styles]="{width: '100%', height:'360px'}" (chartInstance)="getChartInstance($event)"></canvasjs-chart>
      </div>
    </div>

    <div class="d-flex justify-content-center mt-4">
      <form [formGroup]="optionsForm" (ngSubmit)="settings()">
        <button type="submit" class="btn btn-outline-secondary-custom px-5">
          User Settings
        </button>
      </form>
    </div>
  </div>
</div>
<router-outlet></router-outlet>
