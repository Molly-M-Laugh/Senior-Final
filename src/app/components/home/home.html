<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Make compatibile for phone display -->
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>
    <div [class.blurred]="!isConnected && hasAttemptedConnection">
        <body>
            <div class="status-bar">
                <span class="status-pill" [class.online]="isConnected">
                    {{ isConnected ? '● Connection Online' : '○ Connection Offline' }}
                </span>
            </div>

            <div class="controls">
                <button (click)="initBluetooth()" [disabled]="isConnected">
                    Pair ESP32
                </button>
            </div>

            <div class="drop-down">
                <select #selection (change)="onSelectionChange(selection.value)">
                    <option value="s">Last 5 Minutes</option>
                    <option value="m">Last Hour</option>
                    <option value="h">Last Day</option>
                    <option value="W">Last Week</option>
                </select>
            </div>
        
            <div>
                <canvasjs-chart [options]="chartOptions" [styles]="{width: '100%', height:'360px'}" (chartInstance)="getChartInstance($event)"></canvasjs-chart>    
            </div>
        
            <div class="form-container">
                <form [formGroup]="optionsForm" (ngSubmit)="settings()">
                    <button type="submit">Settings</button>
                </form>
            </div>
        </body>
    </div>
</html>
<router-outlet></router-outlet>
