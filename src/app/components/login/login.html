<div class="page-wrapper d-flex flex-column align-items-center justify-content-center">
  <h1 class="brand-text">Vital<span>Vest</span></h1>

  <div class="card shadow-lg border-0 shadow-sm" style="max-width: 400px; width: 100%;">
    <div class="card-body p-4 p-md-5">
      <h2 class="h5 fw-bold mb-4 text-center" style="color: rgb(16, 101, 171);">Sign In</h2>
      
      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="mb-3">
          <input type="text" class="form-control custom-input" formControlName="username" placeholder="Username"/>
        </div>
        <div class="mb-4">
          <input type="password" class="form-control custom-input" formControlName="password" placeholder="Password"/>
        </div>
        <button type="submit" class="btn btn-blue w-100 fw-bold" [disabled]="unactiveLogin">
          Login
        </button>
      </form>

      <form [formGroup]="creationForm" (ngSubmit)="toCreate()" class="mt-4 text-center">
        <button type="submit" class="btn btn-link text-muted small text-decoration-none">
          New to VitalVest? Create Account
        </button>
      </form>
    </div>
  </div>
</div>

<router-outlet></router-outlet>
