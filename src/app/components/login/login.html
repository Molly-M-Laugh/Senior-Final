<div class="login-wrapper d-flex align-items-center justify-content-center">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4 p-md-5">
      <h2 class="text-center mb-4 fw-bold color-primary">Welcome Back</h2>
      
      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="mb-3">
          <label for="username" class="form-label small fw-semibold">Username</label>
          <input 
            type="text" 
            id="username"
            class="form-control custom-input" 
            formControlName="username" 
            placeholder="Enter your username"
          />
        </div>

        <div class="mb-4">
          <label for="password" class="form-label small fw-semibold">Password</label>
          <input 
            type="password" 
            id="password"
            class="form-control custom-input" 
            formControlName="password" 
            placeholder="••••••••"
          />
        </div>

        <button 
          type="submit" 
          class="btn btn-primary-custom w-100 py-2 fw-bold mb-3" 
          [disabled]="unactiveLogin">
          Login
        </button>
      </form>

      <hr class="my-4 text-muted">

      <div class="text-center">
        <p class="text-muted small">Don't have an account?</p>
        <button 
          type="button" 
          (click)="toCreate()" 
          class="btn btn-outline-danger-custom btn-sm px-4">
          Create New User
        </button>
      </div>
    </div>
  </div>
</div>

<router-outlet></router-outlet>
